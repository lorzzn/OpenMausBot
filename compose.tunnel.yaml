# Add this overlay to compose.yaml + compose.vm.yaml.
# Cloudflare provides public HTTPS and connects directly to the HTTP app.
services:
  omb:
    environment:
      OMB_PUBLIC_URL: "${OMB_PUBLIC_URL:?Set OMB_PUBLIC_URL to your public HTTPS URL}"
      OMB_WEBHOOK_PUBLIC_URL: "${OMB_WEBHOOK_PUBLIC_URL:-${OMB_PUBLIC_URL:?Set OMB_PUBLIC_URL to your public HTTPS URL}}"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    user: "${OMB_TUNNEL_UID:-1000}:${OMB_TUNNEL_GID:-1000}"
    network_mode: service:omb
    command:
      - tunnel
      - --url
      - http://127.0.0.1:8799
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - ./.omb-cloudflare/tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      omb:
        condition: service_healthy
